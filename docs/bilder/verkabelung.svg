<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Verkabelung und Stromversorgung">
<style>text{font-family:"DejaVu Sans",Verdana,sans-serif}</style>
<rect width="900" height="340" rx="18" fill="#14161c"/>
<text x="450.0" y="34" text-anchor="middle" fill="#8b93a1" font-size="16">Verkabelung: der Strom fuer das Deck fliesst durch die Platine des Zero</text>
<rect x="40" y="120" width="150" height="86" rx="10" fill="#2d3140"/>
<text x="115" y="155" text-anchor="middle" fill="#e8eaed" font-size="15" font-weight="bold">Netzteil</text>
<text x="115" y="180" text-anchor="middle" fill="#3ddc84" font-size="17" font-weight="bold">5 V / 2,5 A+</text>
<rect x="330" y="96" width="230" height="134" rx="12" fill="#1f6f4a"/>
<text x="445" y="128" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Raspberry Pi Zero 2 W</text>
<rect x="352" y="146" width="86" height="34" rx="7" fill="#14161c"/>
<text x="395" y="168" text-anchor="middle" fill="#ff8a80" font-size="13" font-weight="bold">PWR IN</text>
<rect x="452" y="146" width="86" height="34" rx="7" fill="#14161c"/>
<text x="495" y="168" text-anchor="middle" fill="#3ddc84" font-size="13" font-weight="bold">USB</text>
<text x="395" y="200" text-anchor="middle" fill="#ffffff" fill-opacity="0.7" font-size="11">nur Strom</text>
<text x="495" y="200" text-anchor="middle" fill="#ffffff" fill-opacity="0.7" font-size="11">Daten + Strom</text>
<text x="445" y="222" text-anchor="middle" fill="#ffffff" fill-opacity="0.6" font-size="11">WLAN 2,4 GHz</text>
<rect x="700" y="120" width="160" height="86" rx="10" fill="#2d3140"/>
<text x="780" y="152" text-anchor="middle" fill="#e8eaed" font-size="15" font-weight="bold">Stream Deck</text>
<text x="780" y="176" text-anchor="middle" fill="#8b93a1" font-size="13">15 Tasten</text>
<line x1="190" y1="163" x2="352" y2="163" stroke="#ff8a80" stroke-width="5"/>
<line x1="538" y1="163" x2="700" y2="163" stroke="#3ddc84" stroke-width="5"/>
<text x="271" y="150" text-anchor="middle" fill="#ff8a80" font-size="12">Micro-USB</text>
<text x="619" y="150" text-anchor="middle" fill="#3ddc84" font-size="12">OTG-Adapter</text>
<text x="40" y="278" fill="#e8eaed" font-size="13">Zero unter Last rund 0,6 A, Deck 0,3 bis 0,5 A. Ein USB-Port am Rechner liefert 0,5 bis 0,9 A und reicht nicht:</text>
<text x="40" y="300" fill="#ff8a80" font-size="13">zu wenig Strom aeussert sich als gleichmaessig blinkende gruene LED, also ein Bootschleife.</text>
<text x="40" y="322" fill="#8b93a1" font-size="12">Kontrolle auf dem Pi: vcgencmd get_throttled muss 0x0 liefern.</text>
</svg>