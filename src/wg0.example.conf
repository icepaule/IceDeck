# WireGuard-Client auf dem Pi:  /etc/wireguard/wg0.conf   (chmod 600)
#
# Zweck: Der Pi erreicht den MQTT-Broker im Heimnetz auch dann, wenn er nicht
# im Heim-WLAN haengt, sondern an einem Handy-Hotspot. Der Pi spricht NIE mit
# Solidtime - nur mit dem Broker. Deshalb genuegt ein sehr enger Split-Tunnel.
#
# Bewusst KEIN Autostart: "systemctl is-enabled wg-quick@wg0" muss "disabled"
# melden. Gestartet wird der Tunnel ausschliesslich vom Dispatcher-Skript
# 90-icedeck-vpn, und zwar nur ausserhalb des Heim-WLANs. Grund: zu Hause ist
# das Heimnetz direkt geroutet; ein Tunnel wuerde diese funktionierende Route
# durch eine ersetzen, die ausfallen kann.
#
# Hintergrund und Schritt-fuer-Schritt: docs/10-wlan-vpn.md

[Interface]
# Erzeugt mit:  wg genkey | sudo tee /etc/wireguard/privatekey
# Verlaesst den Pi nie. Nur der oeffentliche Schluessel wandert zum Server.
PrivateKey = PRIVATER_SCHLUESSEL_DES_PI

# Freie Adresse aus dem Tunnelnetz. Auf dem Server als /32 eintragen.
Address = 10.6.0.3/24

[Peer]
PublicKey = OEFFENTLICHER_SCHLUESSEL_DES_SERVERS

# DynDNS-Name des heimischen Anschlusses. Wird bei jedem "wg-quick up" neu
# aufgeloest - nach einem IP-Wechsel daheim hilft ein Neustart der Unit.
Endpoint = MEIN_DYNDNS_NAME:51820

# AllowedIPs ist bei WireGuard beides zugleich: erlaubte Absenderadressen UND
# Routingtabelle. Hier steht deshalb NUR das Heimnetz - alles andere, auch das
# Internet des fremden WLANs, laeuft weiterhin direkt.
#
# Das Tunnelnetz selbst muss mit hinein, sonst ist der Pi unterwegs NICHT
# fernwartbar: Ein SSH vom VPN-Server traegt als Absender dessen Tunneladresse
# (10.6.0.1). Steht die nicht in dieser Liste, verwirft WireGuard das Paket
# stillschweigend - der Tunnel sieht dabei voellig gesund aus.
AllowedIPs = HEIMNETZ/24, 10.6.0.0/24

# Im Mobilfunk kein Luxus: ohne Verkehr vergisst das Carrier-NAT die Zuordnung
# nach kurzer Zeit und der Server kann den Pi nicht mehr erreichen.
PersistentKeepalive = 25
